<div class="rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 p-8 shadow dark:shadow-gray-900 dark:bg-gray-800 transition-colors duration-200">
  <a href="{{include.project.url | relative_url}}">
    {% if include.project.image %}
    <img src="{{include.project.image | relative_url}}" alt="image" class="object-cover w-full h-32 lg:h-48 rounded-lg" />
    {% else %}
    <div class="w-full h-48 bg-gray-200 dark:bg-gray-600 flex items-center justify-center rounded-lg">
    <img src="./assets/images/no_image_available.png" alt="image" class="object-cover w-full h-32 lg:h-48 rounded-lg" />
    </div>
    {% endif %}
    <p class="font-mulish text-gray-500 dark:text-gray-400 mt-6 mb-2 ">{{include.project.category | upcase}}</p>
    <h2 class="text-2xl hover:underline font-bold my-2 text-gray-800 dark:text-gray-200">{{include.project.title}}</h2>
    <div class="font-mulish dark:text-gray-300">
      {{include.project.excerpt}}
    </div>
    <div class="my-4">
      {% for tag in include.project.tags %}
      <category class="font-mulish text-sm text-gray-500 dark:text-gray-400">#{{ tag | xml_escape }}</category>
      {% endfor %}
    </div>
  </a>
</div>
