---
layout: default
---

<link rel="stylesheet" href="{{ './assets/css/monokai.css' | relative_url }}">
<div class="container mx-auto">
  <div id="news" class="prose max-w-[75ch] prose-neutral mx-auto pb-10 pt-20 lg:pt-[90px] lg:pb-20">
    <div class="pb-4">
      <a href="{{site.url}}/category/{{page.categories[0] | replace: ' ', '-' | downcase}}"
        class="no-underline font-mulish text-sm hover:text-sky-400 text-gray-500">
        {{ page.categories[0] | upcase }}
      </a>
    </div>
    <h1 class="text-left text-2xl font-bold md:text-5xl text-black">{{page.title}}</h1>
    <img class="w-full" src="{{page.image | relative_url}}" alt="{{page.title}}">
    <div class="my-6">
      {{content}}
    </div>
  </div>
</div>
